name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: installer/go.mod
      - run: uv sync --extra dev --locked
      - run: python3 scripts/prepare_installer.py
      - run: uv run pytest -q
      - run: python3 scripts/package_thunderstore.py
      - run: python3 scripts/package_manual.py
      - name: Build standalone installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/installer-build
          cd installer
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/installer-build/ValheimVietHoa-Installer-Windows-x64.exe .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/installer-build/ValheimVietHoa-Installer-macOS-x64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/installer-build/ValheimVietHoa-Installer-macOS-arm64 .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/installer-build/ValheimVietHoa-Installer-Linux-x64 .
          cd ../dist/installer-build
          zip -9 ../release/ValheimVietHoa-Installer-Windows-x64.zip ValheimVietHoa-Installer-Windows-x64.exe
          tar -czf ../release/ValheimVietHoa-Installer-macOS-x64.tar.gz ValheimVietHoa-Installer-macOS-x64
          tar -czf ../release/ValheimVietHoa-Installer-macOS-arm64.tar.gz ValheimVietHoa-Installer-macOS-arm64
          tar -czf ../release/ValheimVietHoa-Installer-Linux-x64.tar.gz ValheimVietHoa-Installer-Linux-x64
          cd ..
          cp thunderstore/*.zip manual/*.zip release/
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish rolling main release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f main-latest "$GITHUB_SHA"
          git push origin refs/tags/main-latest --force
          if gh release view main-latest >/dev/null 2>&1; then
            gh release edit main-latest --title "Latest development build" --prerelease --notes "Automated build from main at $GITHUB_SHA."
          else
            gh release create main-latest --title "Latest development build" --prerelease --notes "Automated build from main at $GITHUB_SHA."
          fi
          gh release upload main-latest dist/release/* --clobber
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/release/* --generate-notes --verify-tag
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-files
          path: dist/release/*
